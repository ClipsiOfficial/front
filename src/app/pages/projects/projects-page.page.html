<div class="page-container">

  <!-- Título -->
  <div class="header-row">
    <h1>Mis Proyectos</h1>
  </div>

  <!-- Cargando -->
  <div class="loading" *ngIf="loading">
    <mat-icon>sync</mat-icon>
    <p>Cargando proyectos...</p>
  </div>

  <!-- Sin proyectos -->
  <div class="empty" *ngIf="!loading && projects.length === 0">
    <mat-icon class="icon">folder_open</mat-icon>
    <h2>No tienes proyectos aún</h2>
    <p>Crea tu primer proyecto para comenzar.</p>

    <button mat-raised-button color="primary" routerLink="/projects/new">
      Crear proyecto
    </button>
  </div>

  <!-- Grid de proyectos -->
  <div class="grid" *ngIf="!loading && projects.length > 0">

    <div
      class="card"
      *ngFor="let project of projects"
      [routerLink]="['/projects', project.id]"
    >
      <!-- Icono + Título + Acciones -->
      <div class="card-header">
        <div class="header-content">
          <mat-icon class="icon">folder</mat-icon>
          <h3>{{ project.name }}</h3>
        </div>
        <div class="card-actions">
          <button
            mat-icon-button
            (click)="manageKeywords(project, $event)"
            title="Gestionar palabras clave"
          >
            <mat-icon>label</mat-icon>
          </button>
          <button
            mat-icon-button
            (click)="manageMembers(project, $event)"
            title="Gestionar miembros"
          >
            <mat-icon>people</mat-icon>
          </button>
          <button
            mat-icon-button
            (click)="editProject(project, $event)"
            title="Editar proyecto"
          >
            <mat-icon>edit</mat-icon>
          </button>
          <button
            mat-icon-button
            color="warn"
            (click)="deleteProject(project, $event)"
            title="Eliminar proyecto"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      </div>

      <!-- Topic -->
      <span class="topic-pill">{{ project.topic }}</span>

      <!-- Descripción -->
      <p class="description">
        {{ project.description }}
      </p>
    </div>

  </div>

  <!-- FAB flotante -->
  <button
    mat-fab
    color="primary"
    routerLink="/projects/new"
    class="fab-btn"
  >
    <mat-icon>add</mat-icon>
  </button>

</div>
