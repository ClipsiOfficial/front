<div class="container mx-auto max-w-2xl px-4 sm:px-6 lg:px-8 py-12">
  <div class="bg-card rounded-lg border border-border p-8 space-y-8">
    <div class="flex items-center gap-6">
      <mat-icon class="!w-16 !h-16 text-6xl text-primary">account_circle</mat-icon>
      <h2 class="text-3xl font-semibold text-foreground">{{ username }}</h2>
    </div>

    <div class="space-y-6">
      <div>
        <label class="block text-sm font-medium text-muted-foreground mb-2">Username</label>
        <input [(ngModel)]="username" type="text"
               class="w-full px-3 py-2 border border-border rounded-md bg-input text-foreground focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" />
      </div>

      <div>
        <label class="block text-sm font-medium text-muted-foreground mb-2">Email</label>
        <input [(ngModel)]="email" type="email"
               class="w-full px-3 py-2 border border-border rounded-md bg-input text-foreground focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" />
      </div>

      <div>
        <label class="block text-sm font-medium text-muted-foreground mb-2">Subscription Type</label>
        <p class="px-3 py-2 bg-muted rounded-md text-foreground">{{ subscriptionType }}</p>
      </div>
    </div>

    <div class="flex justify-end">
      <button mat-raised-button color="primary" (click)="updateProfile()"
              class="transition-transform hover:scale-105">
        Update Profile
      </button>
    </div>
  </div>
</div>
