<div class="min-h-[calc(100vh-4rem)] flex items-center justify-center">
  <div class="bg-card p-10 rounded-2xl shadow-md text-center w-full max-w-md">
    <h2 class="text-2xl font-semibold mb-2 text-foreground">Welcome to Clipsi!</h2>
    <p class="text-base opacity-70 mb-6 text-muted-foreground">Sign in with your account to continue</p>

    <form (ngSubmit)="onLogin()" #loginForm="ngForm" class="space-y-4">
      <div>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Email"
          required
          class="w-full px-3 py-3 border border-border rounded-md text-sm text-foreground bg-input focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary transition"
        />
      </div>

      <div>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Password"
          required
          class="w-full px-3 py-3 border border-border rounded-md text-sm text-foreground bg-input focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary transition"
        />
      </div>

      <div *ngIf="errorMessage" class="text-red-500 mb-4 text-sm transition-opacity" [class.opacity-0]="!errorMessage" [class.opacity-100]="!!errorMessage">
        {{ errorMessage }}
      </div>

      <button
        class="w-full px-4 py-3 rounded-2xl text-base bg-primary text-primary-foreground border-none cursor-pointer transition transform hover:scale-105 hover:shadow-md disabled:opacity-60 disabled:cursor-not-allowed"
        type="submit"
        [disabled]="!loginForm.form.valid"
      >
        Sign In
      </button>
    </form>
  </div>
</div>
