<div class="login-container">
  <div class="login-card">
    <h2 class="title">Welcome to Clipsi!</h2>
    <p class="subtitle">Sign in with your account to continue</p>

    <form (ngSubmit)="onLogin()" #loginForm="ngForm">
      <div class="form-group">
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Email"
          required
        />
      </div>

      <div class="form-group">
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Password"
          required
        />
      </div>

      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <button class="login-btn" type="submit" [disabled]="!loginForm.form.valid">
        Sign In
      </button>
    </form>
  </div>
</div>
