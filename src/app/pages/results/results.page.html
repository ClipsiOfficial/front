<div class="w-full py-6">
  <div class="flex flex-col md:flex-row gap-6 px-4 sm:px-6 lg:px-8">
    <!-- Sidebar de filtros -->
    <div class="md:w-72 w-full flex-shrink-0">
      <app-news-filters
        [filters]="filters()"
        [project]="currentProject()"
        [availableSources]="availableSources()"
        [showCategories]="false"
        (filtersChange)="onFiltersChange($event)"
        (keywordsChanged)="onKeywordsChanged()" />
    </div>

    <!-- Contenido principal: noticias y paginación -->
    <div class="flex-1 flex flex-col">
      <!-- Header -->
      <div class="flex items-center justify-between mb-6 h-10">
        <h2 class="text-xl font-semibold">News Results</h2>
      </div>

      @if (filteredNews().length === 0) {
        <div class="text-center py-12 text-muted-foreground border rounded-lg bg-card p-8">
          <p>No news found matching your criteria.</p>
          <p class="mt-2 text-sm">Try adjusting your filters or keywords.</p>
        </div>
      } @else {
        <div class="grid gap-6 md:grid-cols-2 lg:grid-cols-3">
          @for (news of filteredNews(); track news.id) {
            <app-news-card
              [news]="news"
              [isSelected]="selectedNewsIds().includes(news.id)"
              [bookmarkLoading]="newsBeingSaved() === news.id"
              (bookmark)="onToggleNews($event)" />
          }
        </div>

        <!-- Controles de paginación -->
        @if (totalPages() > 1) {
          <div class="flex justify-center items-center gap-2 mt-8">
            <button mat-icon-button (click)="goToPage(currentPage() - 1)" [disabled]="currentPage() === 1">
              <mat-icon>chevron_left</mat-icon>
            </button>
            <span class="px-4 py-2 rounded-md bg-muted text-foreground font-semibold">
              Page {{ currentPage() }} of {{ totalPages() }}
            </span>
            <button mat-icon-button (click)="goToPage(currentPage() + 1)" [disabled]="currentPage() === totalPages()">
              <mat-icon>chevron_right</mat-icon>
            </button>
          </div>
        }
      }
    </div>
  </div>
</div>
