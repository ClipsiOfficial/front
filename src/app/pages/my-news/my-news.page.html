<div class="w-full py-6">
  <div class="flex flex-col md:flex-row gap-6 px-4 sm:px-6 lg:px-8">
    <!-- Sidebar Filters -->
    <div class="md:w-72 w-full flex-shrink-0">
      <app-news-filters
        [filters]="filters()"
        [availableSources]="availableSources()"
        (filtersChange)="onFiltersChange($event)">
      </app-news-filters>
    </div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col">
      <!-- Export Header -->
      <div class="flex items-center justify-between mb-6 h-10">
        <h2 class="text-xl font-semibold">Saved News</h2>
        @if (savedNews().length > 0) {
        <button
          mat-raised-button
          color="primary"
          (click)="handleExport()">
          <mat-icon>download</mat-icon>
          Export ({{ savedNews().length }})
        </button>
        }
      </div>

      <!-- Content -->
      @if (isLoading()) {
      <div class="text-center py-12 text-muted-foreground">
        <p>Loading saved news...</p>
      </div>
      } @else if (savedNews().length === 0) {
      <div class="text-center py-12 text-muted-foreground border rounded-lg bg-card p-8">
        <p>You haven't saved any news yet matching these filters.</p>
        <p class="mt-2 text-sm">Save news from the Results tab or adjust your filters.</p>
      </div>
      } @else {
      <div class="grid gap-6 md:grid-cols-2 lg:grid-cols-3">
        @for (news of savedNews(); track news.id) {
          <app-news-card
            [news]="news"
            [isSelected]="true"
            [showEditButton]="true"
            (bookmark)="onRemove($event)"
            (edit)="onNewsEdit($event)">
          </app-news-card>
        }
      </div>
      }
    </div>
  </div>
</div>
